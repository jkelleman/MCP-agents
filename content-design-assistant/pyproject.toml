[project]
name = "content-design-assistant"
version = "1.0.0"
description = "MCP server for UX writing and content design review"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
]

[project.scripts]
content-design-assistant = "content_design_assistant.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["content_design_assistant"]
