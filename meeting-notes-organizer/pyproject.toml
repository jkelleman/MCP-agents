[project]
name = "meeting-notes-organizer"
version = "1.0.0"
description = "MCP server for processing meeting transcripts and extracting action items"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
]

[project.scripts]
meeting-notes-organizer = "meeting_notes_organizer.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["meeting_notes_organizer"]
