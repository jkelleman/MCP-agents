[project]
name = "documentation-helper"
version = "1.0.0"
description = "MCP server for searching, summarizing, and working with documentation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
]

[project.scripts]
documentation-helper = "documentation_helper.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["documentation_helper"]
